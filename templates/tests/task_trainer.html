<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Тренажёр · МатеМагия</title>
  <!-- Django-шаблон: tests/task_trainer.html -->
  <link rel="icon" href="../../static/img/logo_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/main.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <header class="main-navbar">
    <a class="navbar-logo" href="../dashboard_main.html" aria-label="МатеМагия — на главную">
      <img src="../../static/img/logo_small.png" alt="" width="52" height="52">
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Главное меню">
      <a href="../dashboard_main.html">Главная</a>
      <a href="../learning/topic_catalog.html">Темы</a>
      <a href="task_trainer.html" class="is-active" aria-current="page">Тренажёр</a>
      <a href="../game/challenge_game.html">Испытание</a>
      <a href="../game/achievements_list.html">Достижения</a>
    </nav>
    <div class="navbar-end">
      <div class="user-profile-widget">
        <button class="user-profile-btn" type="button" aria-expanded="false" aria-controls="user-menu">
          <span class="avatar" data-user-initial>А</span>
          <span class="user-meta"><strong data-user-name>Алиса</strong><small data-user-grade>5 класс</small></span>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a href="../progress/profile_stats.html">Личный кабинет</a>
          <!-- Бэкенд: POST-форма на /logout/ с {% csrf_token %} -->
          <a href="../home.html" id="btn-logout">Выйти</a>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <a class="back-link" id="link-back" href="../learning/theory_view.html">← Назад к теме</a>
    <div class="task-head" data-reveal>
      <h1 class="task-header" id="task-header">Дроби</h1>
      <div class="rating-stars-bar" id="rating-stars-bar" aria-label="Прогресс серии">
        <span class="counter" id="task-counter">1 / 10</span>
      </div>
    </div>

    <!-- Данные: задание с сервера (/tasks/next/): task_type, question, options; проверка — POST /tasks/<id>/check/ -->
    <section class="paper trainer-card" id="trainer-card" data-challenge-url="../game/challenge_game.html" data-reveal>
      <form class="task-area" id="task-form" novalidate>
        <span class="task-chip" id="task-chip">Заклинание · Выбор ответа</span>
        <p class="task-question" id="task-question"></p>
        <div class="task-expression" id="task-expression"></div>
        <div id="answer-zone"></div>
        <div class="feedback-panel" id="feedback-panel" role="status" hidden></div>
        <div class="task-actions">
          <button class="btn btn-violet" id="btn-check" type="submit">Проверить</button>
          <button class="btn btn-violet" id="btn-retry-task" type="button" hidden>Попробовать снова</button>
          <button class="btn btn-primary" id="btn-next-task" type="button" hidden>Дальше →</button>
          <button class="btn btn-light" id="btn-skip-task" type="button">Пропустить</button>
          <button class="btn-show-solution" id="btn-show-solution" type="button">Показать решение →</button>
        </div>
      </form>
      <aside class="owl-hint-box is-hidden" id="owl-hint-box">
        <img src="../../static/img/owl.svg" alt="" width="48" height="48">
        <h2>Подсказка мудрой совы</h2>
        <p id="hint-text"></p>
        <button type="button" id="btn-hint">Показать подсказку</button>
      </aside>
    </section>

    <section class="paper result-card" id="result-card" hidden>
      <h2 id="result-title">Серия пройдена!</h2>
      <div class="result-stars" id="result-stars"></div>
      <p id="result-text"></p>
      <p class="result-xp" id="result-xp"></p>
      <div class="hero-actions">
        <a class="btn btn-violet" id="btn-again" href="task_trainer.html">Ещё раз</a>
        <a class="btn btn-light" id="btn-result-back" href="../learning/topic_catalog.html">К темам</a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="../../static/js/nav.js" defer></script>
  <script src="../../static/js/task_check.js" defer></script>
</body>
</html>
