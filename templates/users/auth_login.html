<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Вход · МатеМагия</title>
  <!-- Django-шаблон: users/auth_login.html -->
  <link rel="icon" href="../../static/img/logo_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/main.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="auth-page">
    <section class="auth-hero" data-reveal>
      <a href="../home.html" class="auth-logo-link" aria-label="На главную">
      <div class="logo-orbit">
        <span class="sparkle s1" aria-hidden="true">✦</span>
        <span class="sparkle teal s2" aria-hidden="true">✦</span>
        <span class="sparkle s3" aria-hidden="true">✦</span>
        <div class="orbit-ring orbit-dots" aria-hidden="true"></div>
        <div class="orbit-ring orbit-dash" aria-hidden="true"></div>
        <div class="orbit-glow" aria-hidden="true"></div>
        <img class="app-logo" src="../../static/img/logo.png" alt="МатеМагия" width="320" height="316">
      </div>
      </a>
      <p class="auth-slogan">Открой дверь в мир волшебной математики</p>
    </section>

    <section class="auth-card card" aria-labelledby="auth-title" data-reveal>
      <nav class="auth-tabs" data-active="login" aria-label="Вход или регистрация">
        <a id="tab-login" href="auth_login.html" class="is-active" aria-current="page">Вход</a>
        <a id="tab-register" href="register.html">Регистрация</a>
      </nav>
      <h1 id="auth-title" class="auth-title">С возвращением, маг!</h1>

      <!-- Бэкенд: method="post" action="/login/" + {% csrf_token %}; ошибки сервера — в #form-alert -->
      <form class="auth-form" id="login-form" action="../dashboard_main.html" novalidate>
        <div class="form-alert" id="form-alert" role="alert" hidden></div>
        <div class="field">
          <label for="id_username">Логин</label>
          <input type="text" name="username" id="id_username" placeholder="Например, alisa5" autocomplete="username" required>
          <p class="field-error" hidden></p>
        </div>
        <div class="field">
          <label for="id_password">Пароль</label>
          <input type="password" name="password" id="id_password" placeholder="Волшебное слово" autocomplete="current-password" required>
          <p class="field-error" hidden></p>
        </div>
        <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block btn-lg">Войти в мир магии</button>
      </form>

      <div class="auth-links">
        <details class="password-reset">
          <summary id="link-password-reset">Забыл пароль?</summary>
          <p>Попроси учителя сбросить пароль в панели управления.</p>
        </details>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="../../static/js/nav.js" defer></script>
  <script src="../../static/js/auth.js" defer></script>
</body>
</html>
