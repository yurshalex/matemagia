<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>Регистрация · МатеМагия</title>
  <!-- Django-шаблон: users/register.html -->
  <link rel="icon" href="../../static/img/logo_small.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/main.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="auth-page">
    <section class="auth-hero" data-reveal>
      <a href="../home.html" class="auth-logo-link" aria-label="На главную">
      <div class="logo-orbit">
        <span class="sparkle s1" aria-hidden="true">✦</span>
        <span class="sparkle teal s2" aria-hidden="true">✦</span>
        <span class="sparkle s3" aria-hidden="true">✦</span>
        <div class="orbit-ring orbit-dots" aria-hidden="true"></div>
        <div class="orbit-ring orbit-dash" aria-hidden="true"></div>
        <div class="orbit-glow" aria-hidden="true"></div>
        <img class="app-logo" src="../../static/img/logo.png" alt="МатеМагия" width="320" height="316">
      </div>
      </a>
      <p class="auth-slogan">Открой дверь в мир волшебной математики</p>
    </section>

    <section class="auth-card card" aria-labelledby="auth-title" data-reveal>
      <nav class="auth-tabs" data-active="register" aria-label="Вход или регистрация">
        <a id="tab-login" href="auth_login.html">Вход</a>
        <a id="tab-register" href="register.html" class="is-active" aria-current="page">Регистрация</a>
      </nav>
      <h1 id="auth-title" class="auth-title">Стань учеником школы магии!</h1>

      <!-- Бэкенд: method="post" action="/register/" + {% csrf_token %} -->
      <form class="auth-form" id="register-form" action="../dashboard_main.html" novalidate>
        <div class="form-alert" id="form-alert" role="alert" hidden></div>
        <div class="field-row">
          <div class="field">
            <label for="id_first_name">Имя</label>
            <input type="text" name="first_name" id="id_first_name" placeholder="Алиса" autocomplete="given-name" maxlength="150" required>
            <p class="field-error" hidden></p>
          </div>
          <div class="field">
            <label for="id_grade">Класс</label>
            <select name="grade" id="id_grade">
              <option value="5 класс" selected>5 класс</option>
              <option value="6 класс">6 класс</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="id_username">Логин</label>
          <input type="text" name="username" id="id_username" placeholder="alisa5" autocomplete="username" maxlength="150" pattern="[A-Za-z0-9@.+\-_]+" required>
          <p class="field-help">Латиница, цифры и @ . + - _</p>
          <p class="field-error" hidden></p>
        </div>
        <div class="field">
          <label for="id_password1">Пароль</label>
          <input type="password" name="password1" id="id_password1" placeholder="Не меньше 6 символов" autocomplete="new-password" minlength="6" required>
          <p class="field-error" hidden></p>
        </div>
        <div class="field">
          <label for="id_password2">Повтори пароль</label>
          <input type="password" name="password2" id="id_password2" placeholder="Ещё раз" autocomplete="new-password" required>
          <p class="field-error" hidden></p>
        </div>
        <button type="submit" id="btn-submit-register" class="btn btn-primary btn-block btn-lg">Начать обучение</button>
      </form>

    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="../../static/js/nav.js" defer></script>
  <script src="../../static/js/auth.js" defer></script>
</body>
</html>
